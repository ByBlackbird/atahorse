# Render Blueprint — Atahorse (Node, Docker gerekmez)
services:
  - type: web
    name: atahorse
    runtime: node
    plan: starter            # kalıcı disk için ücretli plan gerekir (SQLite verisi)
    buildCommand: npm install --no-audit --no-fund --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: atahorse-data
      mountPath: /var/data
      sizeGB: 1

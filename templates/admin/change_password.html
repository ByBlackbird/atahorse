{% extends "base.html" %}
{% block title %}{{ _("Şifre Değiştir") }} - Atahorse{% endblock %}
{% block content %}
<div class="dashboard">
    <div class="setup-section" style="max-width:520px;margin:2rem auto">
        <h2><svg class="ico"><use href="#i-key"/></svg> {{ _("Yönetici Şifresini Değiştir") }}</h2>
        <form method="POST" action="{{ url_for('admin_change_password') }}" style="display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem">
            <div>
                <label style="display:block;font-weight:600;margin-bottom:.4rem">{{ _("Mevcut Şifre") }}</label>
                <input type="password" name="current_password" required autocomplete="current-password"
                    style="width:100%;padding:.8rem 1rem;border:2px solid var(--gray-200);border-radius:10px;font-size:1rem">
            </div>
            <div>
                <label style="display:block;font-weight:600;margin-bottom:.4rem">{{ _("Yeni Şifre") }} <small style="color:var(--gray-400)">(en az 8 karakter)</small></label>
                <input type="password" name="new_password" required minlength="8" autocomplete="new-password"
                    style="width:100%;padding:.8rem 1rem;border:2px solid var(--gray-200);border-radius:10px;font-size:1rem">
            </div>
            <div>
                <label style="display:block;font-weight:600;margin-bottom:.4rem">{{ _("Yeni Şifre (Tekrar)") }}</label>
                <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
                    style="width:100%;padding:.8rem 1rem;border:2px solid var(--gray-200);border-radius:10px;font-size:1rem">
            </div>
            <button class="btn btn-primary" type="submit" style="margin-top:.5rem"><svg class="ico"><use href="#i-check"/></svg> {{ _("Şifreyi Güncelle") }}</button>
        </form>
        <p style="margin-top:1.5rem;color:var(--gray-400);font-size:.9rem">
            <svg class="ico"><use href="#i-shield-alt"/></svg> {{ _("Şifreni kimseyle paylaşma. Kayıtlıysa not al. Kaybolursa veritabanından sıfırlanması gerekir.") }}
        </p>
    </div>
</div>
{% endblock %}

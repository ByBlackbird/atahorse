{% extends "base.html" %}
{% block title %}{{ tr('upgrade') }} - Atahorse{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-card">
    <div class="auth-header"><svg class="ico" style="color:var(--warning)"><use href="#i-crown"/></svg>
        <h2>{{ tr('upgrade') }}</h2><p>{{ _("Sınırsız öğrenme seni bekliyor") }}</p></div>
    <form method="POST" class="auth-form">
        <div class="form-group"><label>{{ _("Plan Seç") }}</label>
            <select name="plan" class="ah-select">
                <option value="monthly">{{ _("Aylık Premium") }} — 199 ₺</option>
                <option value="yearly">{{ _("Yıllık Premium") }} — 1.499 ₺ (37% {{ _("indirim") }})</option>
                <option value="course">{{ _("Ek Kurs Hakkı") }} — 49 ₺</option>
            </select></div>
        <div class="form-group"><label>{{ _("Kart Numarası") }} ({{ _("demo") }})</label>
            <input class="form-input" placeholder="4242 4242 4242 4242"></div>
        <button class="btn btn-primary btn-block"><svg class="ico"><use href="#i-lock"/></svg> {{ _("Ödemeyi Tamamla") }} ({{ _("simülasyon") }})</button>
    </form>
    <p style="text-align:center;margin-top:1rem;color:var(--gray-400);font-size:.85rem">{{ _("Bu bir demo ödemesidir; kartınızdan ücret çekilmez.") }}</p>
</div></div>
{% endblock %}
